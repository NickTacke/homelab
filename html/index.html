    <script>

        class Main{
            

            constructor(pass){
                var encrypted = '{"iv":"3QfTkoD3OtxBSOxm1Iys3A==","v":1,"iter":10000,"ks":128,"ts":64,"mode":"ccm","adata":"","cipher":"aes","salt":"2NxDJccCYuY=","ct":"AyymBnWqCGkQbJsxUUPjee9BSihjKEjUiBlW8dz3YmD0Ql8E1zySPI2q+k2MT+GaFRFEtDXnt4DGeFw6U/Bdw+gCFWJxB+47"}'
                try{
                    if(sjcl.decrypt(pass, encrypted)){
                        console.log("Right");
                        this.changes = {vals: "true true"}
                    }
                }catch(error){
                    console.log("Wrong");
                    this.changes = {vals: "false false"};
                }
                this.pass = pass;
                this.amountOfProducts = 0;
            }

            vals(getOrSet, pass){
                let valid;
                let passCorrect;
                var encrypted = '{"iv":"3QfTkoD3OtxBSOxm1Iys3A==","v":1,"iter":10000,"ks":128,"ts":64,"mode":"ccm","adata":"","cipher":"aes","salt":"2NxDJccCYuY=","ct":"AyymBnWqCGkQbJsxUUPjee9BSihjKEjUiBlW8dz3YmD0Ql8E1zySPI2q+k2MT+GaFRFEtDXnt4DGeFw6U/Bdw+gCFWJxB+47"}'
                if(this.changes.vals){
                    var split = this.changes.vals.split(" ");
                    valid = split[0];
                    passCorrect = split[1];
                    this.changes = {};
                }
                try{
                    if(sjcl.decrypt(pass, encrypted)){
                        if(getOrSet == "get"){
                            return valid.toString() + " " + passCorrect.toString()
                        }else if(getOrSet == "set"){
                            this.changes.vals = arguments[2] + " " + arguments[3];
                        }
                    }
                }catch(error){
                    console.log(error)
                    console.log(valid + " " + passCorrect)
                    return "WRONG PASSWORD!"
                }
            }

            Validate(){
                if(this.vals("get", this.pass) == "true true"){
                    return true;
                }else{
                    return false;
                }
            }

            AppendProduct(name, inStock){
                if(this.Validate()){
                    var productContainer = document.getElementsByClassName("products")[0];

                    this.amountOfProducts += 1;

                    var topPx = this.amountOfProducts * 140 - 20;

                    var div = document.createElement("div");
                    div.setAttribute("class", "row");
                    var container = document.createElement("div");
                    container.setAttribute("class", "col-sm-4");
                    var productName = document.createElement("h3");
                    productName.setAttribute("style", `top: ${topPx}px`);
                    productName.innerText = name;
                    var stocks = document.createElement("input");
                    stocks.setAttribute("placeholder", `${inStock} stuks`);
                    stocks.setAttribute("style", `top: ${topPx}px`);
                    stocks.setAttribute("class", "form-control productamount");
                    var savebtn = document.createElement("button");
                    savebtn.setAttribute("style", `top: ${topPx}px`);
                    savebtn.setAttribute("class", "btn btn-success productbtn");
                    savebtn.innerText = "Save"

                    container.appendChild(productName);
                    container.appendChild(stocks);
                    container.appendChild(savebtn);
                    div.appendChild(container);

                    productContainer.append(div);
                }
            }


        }

        var main;

        document.getElementById("LoginButton").addEventListener("click", () => {
            console.log(document.getElementById("PassInput").value)

            main = new Main(document.getElementById("PassInput").value);

            if(main.Validate()){
                if(document.getElementById("LoginButton").classList.contains("btn-danger")){
                    document.getElementById("LoginButton").classList.remove("btn-danger");
                    document.getElementById("LoginButton").classList.add("btn-success");
                }else{
                    document.getElementById("LoginButton").classList.remove("btn-primary");
                    document.getElementById("LoginButton").classList.add("btn-success");
                }
            }else{
                document.getElementById("LoginButton").classList.remove("btn-primary");
                document.getElementById("LoginButton").classList.add("btn-danger");
            }
        });
    </script>
